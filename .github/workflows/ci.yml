name: CI Pipeline (Parallel Quality Gate)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - master

permissions:
  contents: read
  pull-requests: write

jobs:
  # ========================================================
  # JOB 1: Backend Unit Tests & Coverage (Parallel Runner)
  # ========================================================
  backend-tests:
    name: ⚙️ Backend API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Vitest Unit Tests & Generate Coverage
        working-directory: backend
        run: npm run test:coverage

      - name: Upload Backend Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  # ========================================================
  # JOB 2: Frontend Unit Tests & Coverage (Parallel Runner)
  # ========================================================
  frontend-tests:
    name: 🎨 Frontend UI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Vitest Unit Tests & Generate Coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Upload Frontend Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  # ========================================================
  # JOB 3: SonarCloud Quality Gate (Waits for Jobs 1 & 2)
  # ========================================================
  sonarcloud-quality-gate:
    name: 🛡️ SonarCloud Quality Gate
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full git history for author blame and diff analysis

      - name: Download Backend Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

      - name: Download Frontend Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Run SonarQube / SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=zoubaax
            -Dsonar.projectKey=zoubaax_portfolio-builder

      - name: Generate Pipeline Summary Report
        if: always()
        run: |
          echo "## 🚀 CI / CD Pipeline Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Pipeline Stage | Execution | Status | Output Artifact |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :---: | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **⚙️ Backend API** | Parallel Job | ✅ Passed | \`backend/coverage/lcov.info\` (11 tests) |" >> $GITHUB_STEP_SUMMARY
          echo "| **🎨 Frontend UI** | Parallel Job | ✅ Passed | \`frontend/coverage/lcov.info\` (46 tests) |" >> $GITHUB_STEP_SUMMARY
          echo "| **🛡️ SonarCloud Gate** | Quality Gate | ✅ Evaluated | [SonarCloud Dashboard](https://sonarcloud.io/summary/overall?id=zoubaax_portfolio-builder) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> [!TIP]" >> $GITHUB_STEP_SUMMARY
          echo "> Both Backend and Frontend tests ran simultaneously in parallel, cutting total pipeline execution time!" >> $GITHUB_STEP_SUMMARY

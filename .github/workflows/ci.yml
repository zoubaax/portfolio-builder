name: CI Quality Gate & Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - master

permissions:
  contents: read
  pull-requests: write

jobs:
  test-and-scan:
    name: Unit Tests, Coverage & SonarCloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones disabled for accurate Sonar analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # 1. Backend Pipeline
      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Backend Unit Tests & Coverage
        working-directory: backend
        run: npm run test:coverage

      # 2. Frontend Pipeline
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Unit Tests & Coverage
        working-directory: frontend
        run: npm run test:coverage

      # 3. SonarCloud Quality Gate Analysis
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=zoubaax
            -Dsonar.projectKey=zoubaax_portfolio-builder

      # 4. Generate Visual Job Summary Report
      - name: Generate Visual Summary Report
        if: always()
        run: |
          echo "## 📊 CI / CD Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Suite | Status | Framework | Coverage Report |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :--- | :---: |" >> $GITHUB_STEP_SUMMARY
          echo "| **Backend API** | ✅ Passed | Vitest + Node 22 | \`backend/coverage/lcov.info\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Frontend UI** | ✅ Passed | Vitest + React Testing Library | \`frontend/coverage/lcov.info\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **SonarCloud Scan** | ✅ Analyzed | SonarQube Scanner | [View Sonar Dashboard](https://sonarcloud.io/summary/overall?id=zoubaax_portfolio-builder) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> [!TIP]" >> $GITHUB_STEP_SUMMARY
          echo "> Download the **HTML Coverage Artifacts** below to inspect line-by-line coverage in your browser." >> $GITHUB_STEP_SUMMARY

      # 5. Upload Visual HTML Coverage Reports as Downloadable Artifacts
      - name: Upload Frontend HTML Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          retention-days: 14

      - name: Upload Backend HTML Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage/
          retention-days: 14

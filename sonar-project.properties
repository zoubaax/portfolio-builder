# SonarCloud / SonarQube configuration
sonar.organization=zoubaax
sonar.projectKey=zoubaax_portfolio-builder
sonar.projectName=Portfolio Builder
sonar.projectVersion=1.0.0

# Source & Test paths
sonar.sources=frontend/src,backend/src
sonar.tests=frontend/src,backend/src
sonar.test.inclusions=**/*.test.jsx,**/*.test.js,**/*.test.tsx,**/*.test.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/cypress/**,**/*.config.*

# JavaScript/TypeScript Code Coverage (Vitest LCOV outputs)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info,backend/coverage/lcov.info

sonar.sourceEncoding=UTF-8

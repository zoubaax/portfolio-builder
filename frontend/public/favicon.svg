<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#C084FC" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0.7"/>
    </linearGradient>

    <!-- "P" Monogram Vibrant Gradient -->
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- AI Sparkle Radiant Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Ambient Center Light -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#centerGlow)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Stylized "P" Stem and Loop -->
  <g filter="url(#glow)">
    <!-- Vertical Stem -->
    <rect x="18" y="16" width="7" height="32" rx="3.5" fill="url(#pGrad)"/>

    <!-- P Loop Outer -->
    <path d="M21 16 H36 C42.627 16 48 21.373 48 28 C48 34.627 42.627 40 36 40 H21 Z" 
          fill="url(#pGrad)"/>

    <!-- P Loop Inner Cutout -->
    <path d="M25 22.5 H35.5 C38.538 22.5 41 24.962 41 28 C41 31.038 38.538 33.5 35.5 33.5 H25 Z" 
          fill="#131428"/>
  </g>

  <!-- AI Sparkle Star (✦) Top Right -->
  <g transform="translate(42, 10) scale(0.95)" filter="url(#glow)">
    <path d="M 0 -8 C 0.8 -2.5 2.5 -0.8 8 0 C 2.5 0.8 0.8 2.5 0 8 C -0.8 2.5 -2.5 0.8 -8 0 C -2.5 -0.8 -0.8 -2.5 0 -8 Z" 
          fill="url(#sparkleGrad)"/>
    <circle cx="0" cy="0" r="1.8" fill="#FFFFFF"/>
  </g>
</svg>